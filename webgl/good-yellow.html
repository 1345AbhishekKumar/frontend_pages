<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystical Ancient Stone Garden</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1510;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(218, 165, 32, 0.6);
            font-family: 'Times New Roman', serif;
            font-size: 14px;
            pointer-events: none;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="info">Trace the ancient symbols</div>
    <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
let particles = [];
let pillars = [];
let mousePath = [];
let isDragging = false;
let mouseX = 0, mouseY = 0;
const particleCount = 420;
const pillarCount = 5;

// Golden amber palette
const colors = {
    gold: ['#FFD700', '#FFA500', '#DAA520', '#B8860B', '#FFD700'],
    parchment: '#2C2416',
    parchmentLight: '#3D3226',
    hieroglyph: 'rgba(139, 119, 101, 0.15)'
};

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Stone Pillar class - invisible centers of orbit
class Pillar {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 100 + Math.random() * 150;
        this.rotationSpeed = (Math.random() - 0.5) * 0.002;
        this.angle = Math.random() * Math.PI * 2;
        this.height = 200 + Math.random() * 300;
    }

    update() {
        this.angle += this.rotationSpeed;
    }

    draw() {
        // Draw faint pillar outline (barely visible)
        ctx.strokeStyle = 'rgba(139, 119, 101, 0.1)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, this.radius * 0.3, this.radius, 0, 0, Math.PI * 2);
        ctx.stroke();
    }
}

// Particle class - celestial runes
class Particle {
    constructor(pillar) {
        this.pillar = pillar;
        this.orbitRadius = pillar.radius * (0.4 + Math.random() * 0.6);
        this.angle = Math.random() * Math.PI * 2;
        this.speed = (Math.random() - 0.5) * 0.01;
        this.z = (Math.random() - 0.5) * 100; // depth
        this.size = 2 + Math.random() * 3;
        this.color = colors.gold[Math.floor(Math.random() * colors.gold.length)];
        this.brightness = 0.5 + Math.random() * 0.5;
        this.activation = 0; // For mouse interaction glow
        this.runes = ['ᚠ', 'ᚢ', '', '', 'ᚱ', 'ᚲ', '', '', 'ᚺ', 'ᚾ', '', 'ᛃ', 'ᛇ', '', '', 'ᛊ', 'ᛏ', 'ᛒ', 'ᛖ', ''];
        this.rune = this.runes[Math.floor(Math.random() * this.runes.length)];
    }

    update() {
        // Orbital movement
        this.angle += this.speed;
        
        // Calculate position around pillar
        const x = this.pillar.x + Math.cos(this.angle) * this.orbitRadius;
        const y = this.pillar.y + Math.sin(this.angle) * this.orbitRadius * 0.6; // elliptical
        
        // Smooth movement
        this.x = x;
        this.y = y;
        
        // Check mouse proximity for activation
        if (isDragging) {
            const dx = mouseX - this.x;
            const dy = mouseY - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
                this.activation = Math.min(1, this.activation + 0.1);
            }
        }
        
        // Fade activation
        this.activation *= 0.98;
    }

    draw() {
        const glow = 10 + this.activation * 30;
        const alpha = 0.6 + this.activation * 0.4;
        
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Glow effect
        ctx.shadowBlur = glow;
        ctx.shadowColor = this.color;
        
        // Draw rune symbol
        ctx.fillStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.font = `${12 + this.size * 2}px 'Times New Roman'`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.rune, 0, 0);
        
        // Draw particle core
        ctx.beginPath();
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#FFF8DC';
        ctx.fill();
        
        ctx.restore();
    }
}

// Draw hieroglyph background texture
function drawHieroglyphs() {
    ctx.fillStyle = colors.hieroglyph;
    ctx.font = '20px Arial';
    
    const hieroglyphs = ['', '', '𓀂', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', ''];
    
    for (let i = 0; i < 50; i++) {
        const x = (i * 137) % width;
        const y = (i * 89) % height;
        const glyph = hieroglyphs[i % hieroglyphs.length];
        ctx.globalAlpha = 0.1 + Math.sin(i) * 0.05;
        ctx.fillText(glyph, x, y);
    }
    ctx.globalAlpha = 1;
}

// Draw angular rune connections
function drawConnections() {
    ctx.lineWidth = 1;
    
    for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        
        // Connect to nearby particles
        for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < 100) {
                const activation = Math.max(p1.activation, p2.activation);
                const alpha = (1 - dist / 100) * 0.4 * (0.5 + activation);
                
                // Draw angular rune-like line (segmented)
                ctx.strokeStyle = `rgba(255, 215, 0, ${alpha})`;
                ctx.shadowBlur = 5 + activation * 15;
                ctx.shadowColor = '#FFD700';
                
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                
                // Create angular path (rune style)
                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2;
                const angle = Math.atan2(dy, dx);
                const perpX = Math.cos(angle + Math.PI / 2) * 10;
                const perpY = Math.sin(angle + Math.PI / 2) * 10;
                
                // Draw segmented angular line
                ctx.lineTo(midX - perpX, midY - perpY);
                ctx.lineTo(midX + perpX, midY + perpY);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                
                // Draw small rune markers at connection points
                if (activation > 0.3) {
                    ctx.fillStyle = `rgba(255, 255, 200, ${activation})`;
                    ctx.beginPath();
                    ctx.arc(midX, midY, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
    }
    ctx.shadowBlur = 0;
}

// Draw mouse trace path (ancient symbol tracing)
function drawMousePath() {
    if (mousePath.length < 2) return;
    
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#FFD700';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    ctx.beginPath();
    ctx.moveTo(mousePath[0].x, mousePath[0].y);
    
    for (let i = 1; i < mousePath.length; i++) {
        // Create angular, rune-like path
        const prev = mousePath[i - 1];
        const curr = mousePath[i];
        const midX = (prev.x + curr.x) / 2;
        const midY = (prev.y + curr.y) / 2;
        
        ctx.lineTo(midX, midY);
    }
    
    ctx.stroke();
    
    // Fade path
    if (mousePath.length > 0) {
        mousePath[0].life--;
        if (mousePath[0].life <= 0) {
            mousePath.shift();
        }
    }
    
    ctx.shadowBlur = 0;
}

// Initialize
function init() {
    // Create pillars
    for (let i = 0; i < pillarCount; i++) {
        const x = width * (0.2 + (i / (pillarCount - 1)) * 0.6);
        const y = height * (0.3 + Math.random() * 0.4);
        pillars.push(new Pillar(x, y));
    }
    
    // Create particles distributed among pillars
    for (let i = 0; i < particleCount; i++) {
        const pillar = pillars[i % pillarCount];
        particles.push(new Particle(pillar));
    }
}

// Input handling
canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    mouseX = e.clientX;
    mouseY = e.clientY;
});

canvas.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (isDragging) {
        mousePath.push({ x: mouseX, y: mouseY, life: 30 });
        if (mousePath.length > 50) mousePath.shift();
    }
});

canvas.addEventListener('mouseup', () => {
    isDragging = false;
    mousePath = [];
});

canvas.addEventListener('touchstart', (e) => {
    isDragging = true;
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
    e.preventDefault();
});

canvas.addEventListener('touchmove', (e) => {
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
    if (isDragging) {
        mousePath.push({ x: mouseX, y: mouseY, life: 30 });
        if (mousePath.length > 50) mousePath.shift();
    }
    e.preventDefault();
});

canvas.addEventListener('touchend', () => {
    isDragging = false;
    mousePath = [];
});

// Animation loop
function animate() {
    // Clear with parchment background
    ctx.fillStyle = colors.parchment;
    ctx.fillRect(0, 0, width, height);
    
    // Draw hieroglyph texture
    drawHieroglyphs();
    
    // Update and draw pillars
    pillars.forEach(pillar => {
        pillar.update();
        pillar.draw();
    });
    
    // Draw connections first (behind particles)
    drawConnections();
    
    // Update and draw particles
    particles.forEach(particle => {
        particle.update();
        particle.draw();
    });
    
    // Draw mouse trace
    drawMousePath();
    
    // Vignette effect
    const gradient = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
    gradient.addColorStop(0, 'rgba(0,0,0,0)');
    gradient.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
    
    requestAnimationFrame(animate);
}

init();
animate();
</script>
</body>
</html>
